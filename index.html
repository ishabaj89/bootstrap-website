<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Favourite Drinks</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <div class="container">

        <h1 class="text-center">
            My Favourite Drinks ☕
        </h1>

        <div class="row">

            <!-- Card 1 -->
            <div class="col">

                <div class="card">
                    <div class="card-body">

                        <h2 class="card-title">
                            Coffee
                        </h2>

                        <p class="card-text">
                            I love drinking coffee in the morning.
                        </p>

                        <button class="btn btn-primary">
                            Choose Coffee
                        </button>

                    </div>
                </div>

            </div>


            <!-- Card 2 -->
            <div class="col">

                <div class="card">
                    <div class="card-body">

                        <h2 class="card-title">
                            Matcha
                        </h2>

                        <p class="card-text">
                            Matcha is a healthy and refreshing drink.
                        </p>

                        <button class="btn btn-warning">
                            Choose Matcha
                        </button>

                    </div>
                </div>

            </div>


            <!-- Card 3 -->
            <div class="col">

                <div class="card">
                    <div class="card-body">

                        <h2 class="card-title">
                            Hot Chocolate
                        </h2>

                        <p class="card-text">
                            A delicious drink for a cozy evening.
                        </p>

                        <button class="btn btn-danger">
                            Choose Chocolate
                        </button>

                    </div>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
